# When a getty starts, systemd clears the screen together with its scrollback, and the kernel answers that by
# setting the video mode again: the output comes back on while the console still counts as blanked, so
# "laptop-server display" says off over a lit screen. At the start of the system that is a race with
# laptop-server-display-off.service; after a logout on the console it happens every time.
[Service]
TTYVTDisallocate=no
