# laptop-server settings, in shell syntax. After a change: sudo laptop-server battery apply

# Charging stops at this percentage. A battery that sits at 100 % on the charger for years wears out fastest;
# 80 keeps a few hours of power for an outage. 100 is the factory setting; empty leaves the firmware alone.
# "laptop-server check" says whether this laptop can do it.
CHARGE_LIMIT=80
