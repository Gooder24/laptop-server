name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation accessibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check headings, image alt text and link text
        run: python3 .github/scripts/check-docs.py
